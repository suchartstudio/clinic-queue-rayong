<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Smart Queue System</title>
    
    <link rel="icon" type="image/png" href="icon-192.png">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <link class="pwa-meta" rel="manifest" href="manifest.json">
    <meta class="pwa-meta" name="theme-color" content="#000000">
    <meta class="pwa-meta" name="mobile-web-app-capable" content="yes">
    <meta class="pwa-meta" name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        body { 
            font-family: 'Sarabun', sans-serif; 
            background-color: #000000;
        }
        /* แอนิเมชันชีพจรสีฟ้าสำหรับคิวที่กำลังเรียกล่าสุด */
        @keyframes pulse-cyan {
            0%, 100% { box-shadow: 0 0 0 0 rgba(6, 182, 212, 0.8); }
            50% { box-shadow: 0 0 0 30px rgba(6, 182, 212, 0); }
        }
        .animate-pulse-cyan { animation: pulse-cyan 2s infinite; }
        
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in { animation: fade-in 0.3s ease-out forwards; }
    </style>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => {
                        reg.update();
                        console.log('PWA Service Worker Registered!');
                    })
                    .catch(err => console.error('Service Worker Failed:', err));
            });
        }
    </script>
</head>
<body class="bg-black text-white selection:bg-blue-600">

    <div id="app"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, remove, get } 
        from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyC32IBGgnHx9lJhembi_yD-lIk5hBZ26b8",
            authDomain: "queue-3d381.firebaseapp.com",
            databaseURL: "https://queue-3d381-default-rtdb.asia-southeast1.firebasedatabase.app", 
            projectId: "queue-3d381",
            storageBucket: "queue-3d381.firebasestorage.app",
            messagingSenderId: "872308692589",
            appId: "1:872308692589:web:3ceae944b4b0fc4b3b9164",
            measurementId: "G-HBV54PN9VV"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let allVoices = [];
        window.speechSynthesis.onvoiceschanged = () => {
            allVoices = window.speechSynthesis.getVoices();
        };

        const params = new URLSearchParams(window.location.search);
        const mode = params.get('mode') || 'kiosk'; 
        const AVG_SERVICE_TIME = 5; 

        // ตัวตั้งค่าสีของป้าย: โทนน้ำเงิน-ฟ้า (Cyan & Blue) บนพื้นหลังมืด
        const getCounterConfig = (counterNum) => {
            if (counterNum === 1) return { type: 'walkin', label: 'Walk-in', color: 'bg-blue-900 text-blue-200 border-blue-500', activeBtn: 'border-cyan-400 bg-blue-900 text-cyan-300 shadow-lg' };
            if (counterNum === 2) return { type: 'vaccine', label: 'นัดรับวัคซีน', color: 'bg-cyan-900 text-cyan-200 border-cyan-500', activeBtn: 'border-cyan-400 bg-cyan-900 text-cyan-300 shadow-lg' };
            if (counterNum === 3) return { type: 'course', label: 'นัดฝึกคอร์ส', color: 'bg-indigo-900 text-indigo-200 border-indigo-500', activeBtn: 'border-cyan-400 bg-indigo-900 text-cyan-300 shadow-lg' };
            return { type: 'walkin', label: 'Walk-in', color: 'bg-blue-900 text-blue-200 border-blue-500', activeBtn: 'border-cyan-400 bg-blue-900 text-cyan-300' };
        };

        const playBeep = (type = 'normal') => {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();
                const now = ctx.currentTime;

                if (type === 'alarm') {
                    [0, 0.4, 0.8].forEach(delay => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.type = 'square'; 
                        osc.frequency.setValueAtTime(880, now + delay); 
                        osc.frequency.linearRampToValueAtTime(600, now + delay + 0.3); 
                        gain.gain.setValueAtTime(0.5, now + delay); 
                        gain.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.3);
                        osc.start(now + delay);
                        osc.stop(now + delay + 0.3);
                    });
                } else {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.value = 660; 
                    gain.gain.setValueAtTime(0.1, now); 
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                }
            } catch (e) { console.error("Audio Error", e); }
        };

        const vibrateDevice = (pattern) => {
            if (navigator.vibrate) navigator.vibrate(pattern);
        };

        const renderApp = () => {
            const appDiv = document.getElementById('app');
            if (mode === 'kiosk') renderKiosk(appDiv);
            else if (mode === 'user') renderUser(appDiv);
            else if (mode === 'staff') renderStaff(appDiv);
            else if (mode === 'tv') renderTV(appDiv);
        };

        // ==========================================
        // 1. KIOSK MODE (หน้าตู้กดคิว - ตัวหนังสือใหญ่ สีน้ำเงินฟ้า)
        // ==========================================
        const renderKiosk = (container) => {
            let resetTimer = null;
            let currentUnsubscribe = null;
            const resetKioskUI = () => {
                const resultBox = document.getElementById('kiosk-result');
                const kioskButtons = document.getElementById('kiosk-buttons');
                const welcome = document.getElementById('welcome-text');
                if(resultBox) resultBox.classList.add('hidden');
                if(kioskButtons) kioskButtons.style.display = 'flex';
                if(welcome) welcome.style.display = 'block';
                if(resetTimer) clearTimeout(resetTimer);
                if(currentUnsubscribe) currentUnsubscribe(); 
            };
            container.innerHTML = `
                <div class="min-h-screen flex flex-col items-center justify-center bg-black text-white p-6">
                    <div class="bg-gray-900 border-4 border-blue-600 p-10 rounded-3xl shadow-2xl text-center max-w-2xl w-full min-h-[600px] flex flex-col justify-center relative">
                        <div id="welcome-text" class="mb-6">
                            <h1 class="text-5xl font-black mb-4 tracking-wide text-cyan-400">ยินดีต้อนรับ</h1>
                            <p class="text-2xl text-gray-400">กรุณากดปุ่มเพื่อรับบัตรคิว</p>
                        </div>
                        <div id="kiosk-buttons" class="flex flex-col gap-6 w-full">
                            <button id="btn-q-walkin" class="w-full bg-blue-700 hover:bg-blue-600 text-white text-4xl font-extrabold py-8 rounded-2xl shadow-xl transform transition active:scale-95 flex items-center justify-between px-10 border-2 border-blue-400">
                                <span class="flex items-center gap-4"><i class="fa-solid fa-person-walking text-5xl text-cyan-300"></i> Walk-in</span>
                                <span class="bg-black/40 text-xl px-4 py-2 rounded-lg font-normal text-cyan-300">ช่อง 1</span>
                            </button>
                            <button id="btn-q-vaccine" class="w-full bg-cyan-700 hover:bg-cyan-600 text-white text-4xl font-extrabold py-8 rounded-2xl shadow-xl transform transition active:scale-95 flex items-center justify-between px-10 border-2 border-cyan-400">
                                <span class="flex items-center gap-4"><i class="fa-solid fa-syringe text-5xl text-blue-200"></i> รับวัคซีน</span>
                                <span class="bg-black/40 text-xl px-4 py-2 rounded-lg font-normal text-blue-200">ช่อง 2</span>
                            </button>
                            <button id="btn-q-course" class="w-full bg-indigo-700 hover:bg-indigo-600 text-white text-4xl font-extrabold py-8 rounded-2xl shadow-xl transform transition active:scale-95 flex items-center justify-between px-10 border-2 border-indigo-400">
                                <span class="flex items-center gap-4"><i class="fa-solid fa-graduation-cap text-5xl text-cyan-300"></i> ฝึกคอร์ส</span>
                                <span class="bg-black/40 text-xl px-4 py-2 rounded-lg font-normal text-cyan-300">ช่อง 3</span>
                            </button>
                        </div>
                        <div id="kiosk-result" class="hidden w-full animate-fade-in flex flex-col items-center">
                            <p class="text-gray-400 text-2xl font-bold">หมายเลขคิวของคุณ</p>
                            <div id="q-number" class="text-9xl font-black text-cyan-400 my-6 tracking-tight"></div>
                            <div class="bg-white p-6 rounded-2xl shadow-inner mb-6">
                                <div id="qr-code"></div>
                            </div>
                            <p class="text-3xl font-black text-blue-400 animate-pulse"><i class="fa-solid fa-mobile-screen-button"></i> สแกนเพื่อดูคิวบนมือถือ</p>
                            <button id="btn-cancel" class="mt-10 text-gray-500 underline text-xl hover:text-gray-300">ปิดหน้าต่างนี้</button>
                        </div>
                    </div>
                </div>
            `;
            const generateQueue = (prefix, typeName) => {
                const qRef = push(ref(db, 'queues'));
                const qNum = prefix + Math.floor(100 + Math.random() * 900); 
                set(qRef, { number: qNum, status: 'waiting', timestamp: Date.now(), scanned: false, type: typeName });
                document.getElementById('kiosk-buttons').style.display = 'none';
                document.getElementById('welcome-text').style.display = 'none';
                document.getElementById('q-number').innerText = qNum;
                document.getElementById('kiosk-result').classList.remove('hidden');
                const trackingUrl = `${window.location.origin}${window.location.pathname}?mode=user&id=${qRef.key}`;
                document.getElementById('qr-code').innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(trackingUrl)}" alt="QR" class="mx-auto" />`;
                resetTimer = setTimeout(() => resetKioskUI(), 30000);
                currentUnsubscribe = onValue(qRef, (snapshot) => {
                    const data = snapshot.val();
                    if (data && data.scanned === true) resetKioskUI();
                });
            };
            document.getElementById('btn-q-walkin').onclick = () => generateQueue('W', 'walkin');
            document.getElementById('btn-q-vaccine').onclick = () => generateQueue('V', 'vaccine');
            document.getElementById('btn-q-course').onclick = () => generateQueue('C', 'course');
            document.getElementById('btn-cancel').onclick = resetKioskUI;
        };

        // ==========================================
        // 2. USER MODE (หน้าจอมือถือคนไข้ - ตัวหนังสือใหญ่ อ่านง่ายมาก)
        // ==========================================
        const renderUser = (container) => {
            const ticketId = params.get('id');
            let soundEnabled = false, notifiedNear = false, notifiedServe = false;
            if (!ticketId) { container.innerHTML = `<div class="p-10 text-center text-2xl text-red-400">ไม่พบข้อมูลคิว</div>`; return; }
            update(ref(db, 'queues/' + ticketId), { scanned: true });
            container.innerHTML = `
                <div class="min-h-screen bg-black flex flex-col items-center p-6 transition-colors duration-500" id="user-bg">
                    <button id="btn-enable-sound" class="mb-6 bg-gray-900 border-2 border-blue-500 text-cyan-400 px-6 py-3 rounded-full text-lg font-bold flex items-center gap-3 shadow-lg animate-bounce"><i class="fa-solid fa-volume-xmark"></i> เปิดเสียงแจ้งเตือนคิว</button>
                    <div id="capture-area" class="bg-gray-900 w-full max-w-md rounded-3xl shadow-2xl p-8 text-center relative overflow-hidden border border-blue-900">
                        <div class="border-b border-gray-800 pb-4 mb-4">
                            <div class="text-lg font-bold text-blue-400 uppercase tracking-widest">คลินิกคิวระยอง</div>
                            <div class="text-sm text-gray-500" id="timestamp-display"></div>
                        </div>
                        <div id="status-badge" class="absolute top-0 left-0 w-full h-3 bg-gray-700"></div>
                        <p class="text-gray-400 text-xl mt-4">หมายเลขคิวของคุณ</p>
                        <h1 id="my-q" class="text-8xl font-black text-white my-4 tracking-tight">-</h1>
                        <div class="bg-blue-950/50 border-2 border-blue-800 rounded-2xl p-6 my-6">
                            <p class="text-3xl font-black text-cyan-300" id="status-text">กำลังรอเรียก...</p>
                            <div id="eta-box" class="mt-4 text-xl text-gray-400">รออีก <span id="q-ahead" class="font-bold text-white text-2xl">0</span> คิว (~<span id="eta-time" class="text-white text-2xl">-</span> นาที)</div>
                        </div>
                    </div>
                    <button id="btn-save-ticket" class="mt-8 bg-blue-600 hover:bg-blue-700 text-white text-xl py-4 px-10 rounded-full shadow-lg font-bold flex items-center gap-2 transform active:scale-95 transition"><i class="fa-solid fa-download"></i> เซฟรูปบัตรคิวลงมือถือ</button>
                </div>
            `;
            const btnSound = document.getElementById('btn-enable-sound');
            btnSound.onclick = () => { soundEnabled = true; playBeep('normal'); btnSound.className = "mb-6 bg-blue-950 border-2 border-cyan-400 text-cyan-300 px-6 py-3 rounded-full text-lg font-bold flex items-center gap-3 shadow-lg"; btnSound.innerHTML = `<i class="fa-solid fa-volume-high"></i> เปิดเสียงแล้ว`; };
            document.getElementById('btn-save-ticket').onclick = () => { html2canvas(document.getElementById('capture-area'), { backgroundColor: '#111827', scale: 2 }).then(canvas => { const link = document.createElement('a'); link.download = `Queue-Ticket.png`; link.href = canvas.toDataURL("image/png"); link.click(); }); };
            onValue(ref(db, 'queues'), (snapshot) => {
                const allData = snapshot.val() || {}; const myData = allData[ticketId];
                if (!myData) { document.getElementById('status-text').innerText = "คิวนี้ถูกยกเลิก"; return; }
                document.getElementById('my-q').innerText = myData.number;
                const date = new Date(myData.timestamp); document.getElementById('timestamp-display').innerText = date.toLocaleDateString('th-TH') + ' ' + date.toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'});
                const bg = document.getElementById('user-bg'), badge = document.getElementById('status-badge'), statusTxt = document.getElementById('status-text');
                if (myData.status === 'serving') {
                    bg.className = "min-h-screen flex flex-col items-center p-6 bg-blue-950"; badge.className = "absolute top-0 left-0 w-full h-4 bg-cyan-400 animate-pulse";
                    statusTxt.innerHTML = `เชิญไปที่ <span class="text-4xl block mt-2 text-white font-black bg-cyan-600 px-4 py-2 rounded-xl">ช่องบริการที่ ${myData.counter}</span>`; document.getElementById('eta-box').style.display = 'none';
                    if (soundEnabled && !notifiedServe) { playBeep('alarm'); vibrateDevice([500, 200, 500]); notifiedServe = true; }
                } else if (myData.status === 'waiting') {
                    bg.className = "min-h-screen flex flex-col items-center p-6 bg-black"; badge.className = "absolute top-0 left-0 w-full h-3 bg-blue-600"; statusTxt.innerText = "กำลังรอเรียก..."; document.getElementById('eta-box').style.display = 'block';
                    let qAhead = 0; Object.values(allData).forEach(q => { if (q.status === 'waiting' && q.type === myData.type && q.timestamp < myData.timestamp) qAhead++; });
                    document.getElementById('q-ahead').innerText = qAhead; document.getElementById('eta-time').innerText = Math.ceil((qAhead * AVG_SERVICE_TIME)) || 1;
                    if (qAhead <= 1 && qAhead > 0 && soundEnabled && !notifiedNear) { playBeep('normal'); notifiedNear = true; }
                }
            });
        };

        // ==========================================
        // 3. STAFF MODE (หน้าจอเจ้าหน้าที่กดเรียกคิว)
        // ==========================================
        const renderStaff = (container) => {
            let currentCounter = 1;
            let currentQID = null;

            container.innerHTML = `
                <div class="min-h-screen bg-black p-4 md:p-8 text-white">
                    <div class="max-w-5xl mx-auto">
                        <div class="bg-gray-900 p-6 rounded-2xl shadow-xl mb-6 border border-gray-800">
                            <p class="text-xl font-bold text-cyan-400 uppercase tracking-wider mb-4"><i class="fa-solid fa-layer-group"></i> เลือกช่องบริการประจำเครื่องของคุณ:</p>
                            <div class="grid grid-cols-3 gap-4" id="counter-selector-group">
                                <button data-counter="1" class="counter-tab-btn p-4 rounded-xl border-2 text-center transition flex flex-col items-center justify-center gap-1">
                                    <span class="text-2xl font-black">ช่อง No. 1</span>
                                    <span class="text-sm opacity-80">คิว Walk-in</span>
                                </button>
                                <button data-counter="2" class="counter-tab-btn p-4 rounded-xl border-2 text-center transition flex flex-col items-center justify-center gap-1">
                                    <span class="text-2xl font-black">ช่อง No. 2</span>
                                    <span class="text-sm opacity-80">นัดรับวัคซีน</span>
                                </button>
                                <button data-counter="3" class="counter-tab-btn p-4 rounded-xl border-2 text-center transition flex flex-col items-center justify-center gap-1">
                                    <span class="text-2xl font-black">ช่อง No. 3</span>
                                    <span class="text-sm opacity-80">นัดฝึกคอร์ส</span>
                                </button>
                            </div>
                            <div class="mt-5 pt-4 border-t border-gray-800 flex justify-between items-center">
                                <span class="text-lg font-bold text-gray-400"><i class="fa-solid fa-user-tie mr-2 text-blue-400"></i> ระบบพร้อมใช้งาน</span>
                                <div id="counter-type-badge" class="text-base font-black px-4 py-1.5 rounded-full border"></div>
                            </div>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div class="bg-gray-900 p-8 rounded-2xl shadow-xl text-center border-t-8 border-blue-500">
                                <h2 class="text-gray-400 text-xl font-bold uppercase tracking-wide">กำลังให้บริการคิว</h2>
                                <div id="staff-current-q" class="text-8xl font-black text-cyan-300 my-8 min-h-[100px] tracking-tight">-</div>
                                <button id="btn-finish" disabled class="w-full bg-blue-600 hover:bg-blue-500 disabled:bg-gray-800 disabled:text-gray-600 text-white font-black text-2xl py-5 rounded-xl transition shadow-lg">
                                    <i class="fa-solid fa-check mr-2"></i> กดจบงานคิวนี้ (Finish)
                                </button>
                            </div>
                            
                            <div class="bg-gray-900 p-8 rounded-2xl shadow-xl border-t-8 border-cyan-400 flex flex-col">
                                <div class="flex justify-between items-center mb-6">
                                    <div>
                                        <h2 class="text-gray-400 text-lg font-bold uppercase">จำนวนคิวที่รอในระบบ</h2>
                                        <div class="text-5xl font-black text-white mt-1" id="staff-wait-count">0</div>
                                    </div>
                                    <button id="btn-call" class="bg-cyan-500 hover:bg-cyan-400 text-black text-2xl font-black py-5 px-8 rounded-xl shadow-xl active:scale-95 transition">
                                        เรียกคิวถัดไป <i class="fa-solid fa-bullhorn ml-1"></i>
                                    </button>
                                </div>
                                <div class="flex-1 overflow-y-auto max-h-[250px] bg-black rounded-xl p-3 border border-gray-800">
                                    <ul id="staff-wait-list" class="space-y-3"></ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="text-center mt-16"><button id="btn-reset" class="text-sm text-gray-600 underline hover:text-red-400">ล้างฐานข้อมูลคิวทั้งหมด (Reset System)</button></div>
                </div>
            `;

            const updateTabButtonsUI = () => {
                document.querySelectorAll('.counter-tab-btn').forEach(btn => {
                    const btnNum = parseInt(btn.getAttribute('data-counter'));
                    const conf = getCounterConfig(btnNum);
                    if (btnNum === currentCounter) {
                        btn.className = `counter-tab-btn p-4 rounded-xl border-2 text-center transition flex flex-col items-center justify-center gap-1 ${conf.activeBtn}`;
                    } else {
                        btn.className = `counter-tab-btn p-4 rounded-xl border-gray-800 bg-gray-900 text-gray-500 hover:bg-gray-800 text-center transition flex flex-col items-center justify-center gap-1`;
                    }
                });
            };

            const updateUI = (data) => {
                updateTabButtonsUI();
                const config = getCounterConfig(currentCounter);
                const badge = document.getElementById('counter-type-badge');
                badge.className = `text-base font-black px-4 py-1.5 rounded-full ${config.color}`;
                badge.innerText = `โหมดเรียกคิว: ${config.label}`;

                const queues = Object.entries(data || {}).map(([k, v]) => ({ id: k, ...v }));
                const myServing = queues.find(q => q.status === 'serving' && parseInt(q.counter) === currentCounter);
                
                if (myServing) {
                    currentQID = myServing.id;
                    document.getElementById('staff-current-q').innerText = myServing.number;
                    document.getElementById('btn-finish').disabled = false;
                    document.getElementById('btn-call').disabled = true;
                    document.getElementById('btn-call').classList.add('opacity-30');
                } else {
                    currentQID = null;
                    document.getElementById('staff-current-q').innerText = "-";
                    document.getElementById('btn-finish').disabled = true;
                    document.getElementById('btn-call').disabled = false;
                    document.getElementById('btn-call').classList.remove('opacity-30');
                }

                const waiting = queues.filter(q => q.status === 'waiting' && q.type === config.type).sort((a,b) => a.timestamp - b.timestamp);
                document.getElementById('staff-wait-count').innerText = waiting.length;
                document.getElementById('staff-wait-list').innerHTML = waiting.map(q => 
                    `<li class="flex justify-between items-center p-3.5 bg-gray-900 border border-gray-800 rounded-xl animate-fade-in">
                        <span class="text-2xl font-black text-cyan-300"><i class="fa-solid fa-ticket text-blue-500 mr-2 text-lg"></i> ${q.number}</span>
                        <span class="text-gray-400 text-lg">${new Date(q.timestamp).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})} น.</span>
                     </li>`
                ).join('');
            };

            document.querySelectorAll('.counter-tab-btn').forEach(btn => {
                btn.onclick = (e) => {
                    currentCounter = parseInt(e.currentTarget.getAttribute('data-counter'));
                    get(ref(db, 'queues')).then(snap => updateUI(snap.val()));
                };
            });

            document.getElementById('btn-call').onclick = async () => {
                const config = getCounterConfig(currentCounter);
                const snap = await get(ref(db, 'queues'));
                const queues = Object.entries(snap.val() || {}).map(([k,v]) => ({id:k, ...v}));
                const nextQ = queues.filter(q => q.status === 'waiting' && q.type === config.type).sort((a,b) => a.timestamp - b.timestamp)[0];
                if (nextQ) update(ref(db, `queues/${nextQ.id}`), { status: 'serving', counter: currentCounter, callTime: Date.now() });
                else alert(`ไม่มีคิวประเภท ${config.label} ในระบบแล้วครับ`);
            };

            document.getElementById('btn-finish').onclick = () => { if (currentQID) update(ref(db, `queues/${currentQID}`), { status: 'done' }); };
            document.getElementById('btn-reset').onclick = () => { if(confirm('⚠️ คำเตือน: คุณกำลังจะลบข้อมูลคิวทั้งหมดในระบบ ต้องการดำเนินการต่อใช่หรือไม่?')) set(ref(db, 'queues'), null); }
            onValue(ref(db, 'queues'), (snap) => updateUI(snap.val()));
        };

        // ==========================================
        // 4. TV DISPLAY MODE (หน้าจอทีวีรวม - ตัวหนังสือใหญ่ยักษ์พิเศษ)
        // ==========================================
        const renderTV = (container) => {
            let lastAnnounce = "";
            container.innerHTML = `
                <div class="relative w-screen h-screen bg-black text-white overflow-hidden flex flex-col md:flex-row">
                    <div id="sound-overlay" class="absolute inset-0 bg-black/98 z-50 flex items-center justify-center cursor-pointer">
                        <div class="text-center p-10 border-4 border-blue-500 rounded-3xl max-w-lg bg-gray-900">
                            <i class="fa-solid fa-play text-8xl mb-6 text-cyan-400 animate-pulse"></i>
                            <h2 class="text-4xl font-black mb-2">เปิดระบบจอทีวีคิว</h2>
                            <p class="text-xl text-gray-400 mt-2">คลิกหน้าจอนี้เพื่อเริ่มต้นเสียงประกาศระบบคิวและวิดีโอ</p>
                        </div>
                    </div>
                    <div class="w-full md:w-[50%] h-full bg-black relative flex items-center justify-center border-b md:border-b-0 md:border-r-2 border-gray-800">
                        <video id="tv-player" class="w-full h-full object-contain" loop muted playsinline>
                            <source src="video.mp4" type="video/mp4">
                        </video>
                        <div class="absolute top-4 left-4 bg-blue-900/80 border border-blue-400 px-4 py-1.5 rounded-lg text-lg text-white font-bold pointer-events-none">
                            <i class="fa-solid fa-film mr-2 text-cyan-300"></i> สื่อประชาสัมพันธ์
                        </div>
                    </div>
                    <div class="w-full md:w-[50%] h-full flex flex-col justify-between bg-black">
                        <div class="p-6 flex-1 flex flex-col min-h-[55%] justify-start">
                            <h1 class="text-3xl font-black text-cyan-400 mb-6 tracking-wider border-b-4 border-blue-900 pb-3 flex justify-between items-center">
                                <span>กำลังเรียก / NOW SERVING</span>
                                <i class="fa-solid fa-bullhorn text-cyan-400 text-2xl animate-bounce"></i>
                            </h1>
                            <div id="tv-serving-list" class="space-y-5 overflow-y-auto max-h-[480px] pr-1"></div>
                        </div>
                        <div class="p-6 bg-gray-950 border-t-4 border-blue-900 h-[28%] min-h-[180px]">
                            <h2 class="text-2xl font-black text-blue-400 mb-4 uppercase tracking-wide flex items-center gap-3">
                                <i class="fa-solid fa-list-ol text-sm text-cyan-300"></i> คิวถัดไป / NEXT
                            </h2>
                            <ul id="tv-waiting-list" class="grid grid-cols-3 gap-4 text-3xl font-black"></ul>
                        </div>
                    </div>
                </div>
            `;

            const videoElement = document.getElementById('tv-player');
            document.getElementById('sound-overlay').onclick = function() {
                this.remove();
                playBeep('normal');
                if (videoElement) { videoElement.play().catch(e => console.error(e)); }
            };

            const speak = (text) => {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'th-TH';
                utterance.rate = 0.85;
                const voices = window.speechSynthesis.getVoices();
                const maleVoice = voices.find(v => v.lang.includes('th') && (v.name.includes('Male') || v.name.includes('Niwat') || v.name.includes('Pattara')));
                if (maleVoice) utterance.voice = maleVoice;
                window.speechSynthesis.speak(utterance);
            };

            onValue(ref(db, 'queues'), (snapshot) => {
                const queues = Object.values(snapshot.val() || {});
                const serving = queues.filter(q => q.status === 'serving').sort((a,b) => b.callTime - a.callTime);
                
                if (serving.length > 0) {
                    const latest = serving[0];
                    const uniqueKey = latest.number + latest.callTime;
                    if (lastAnnounce !== uniqueKey) {
                        lastAnnounce = uniqueKey;
                        playBeep('normal'); 
                        setTimeout(() => {
                            const formattedNumber = latest.number.split('').join(' ');
                            speak(`เชิญคิว ${formattedNumber} ที่ช่องบริการหมายเลข ${latest.counter} ครับ`);
                        }, 500);
                    }
                }
                
                // ออกแบบการ์ดคิวที่จอทีวี: พื้นหลังดำ ตัวคิวใหญ่มาก ป้ายช่องบริการเน้นโทนสีน้ำเงิน-ฟ้าสว่างชัดเจน
                document.getElementById('tv-serving-list').innerHTML = serving.map((q, idx) => {
                    const isNew = idx === 0; 
                    return `
                    <div class="${isNew ? 'bg-gray-900 border-2 border-cyan-400 animate-pulse-cyan shadow-cyan-500/50' : 'bg-gray-950 border border-gray-900 text-gray-500'} 
                        p-5 rounded-2xl shadow-xl flex justify-between items-center transition-all">
                        <div>
                            <span class="${isNew ? 'text-lg text-cyan-400' : 'text-sm text-gray-600'} block font-bold mb-1">หมายเลขคิว</span>
                            <span class="${isNew ? 'text-8xl text-white' : 'text-5xl text-gray-400'} font-black tracking-tight">${q.number}</span>
                        </div>
                        <div class="text-right">
                            <span class="${isNew ? 'text-lg text-cyan-400' : 'text-sm text-gray-600'} block font-bold mb-1">ช่องบริการ</span>
                            <span class="${isNew ? 'text-7xl bg-blue-700 text-white border border-blue-400 px-6 py-1 rounded-2xl' : 'text-4xl bg-gray-900 text-gray-500 px-4 py-1 rounded-xl'} font-black">${q.counter}</span>
                        </div>
                    </div>`;
                }).join('');

                const waiting = queues.filter(q => q.status === 'waiting').sort((a,b) => a.timestamp - b.timestamp).slice(0, 6);
                document.getElementById('tv-waiting-list').innerHTML = waiting.map(q => `
                    <li class="flex items-center justify-center gap-3 bg-gray-900 px-4 py-3 rounded-xl border border-blue-900/60 shadow-inner">
                        <i class="fa-solid fa-circle text-xs text-cyan-400 animate-ping"></i>
                        <span class="font-bold text-4xl text-cyan-300 tracking-tight">${q.number}</span>
                    </li>
                `).join('');
            });
        };

        renderApp();
    </script>
</body>
</html>
